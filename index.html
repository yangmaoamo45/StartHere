    <style>
        /* ===== CSS 变量（深色/浅色模式） ===== */

            --bg-start: #f0f6fc;
            --bg-end: #dce8f0;
            --card-bg: rgba(255, 255, 255, 0.72);
            --card-border: rgba(255, 255, 255, 0.5);

            --text-muted: #6a8a9a;
            --text-light: #8aacbc;

            --widget-bg: rgba(255, 255, 255, 0.4);
            --tag-bg: rgba(255, 255, 255, 0.7);
            --border-light: rgba(0, 0, 0, 0.04);
            --code-bg: rgba(0, 0, 0, 0.04);
            --blur: 18px;
        }
        [data-theme="dark"] {

            --bg-end: #1a1a2e;
            --card-bg: rgba(20, 20, 40, 0.82);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0c8;
            --text-muted: #8888a8;
            --text-light: #666688;
            --input-bg: rgba(40, 40, 60, 0.85);

            --widget-bg: rgba(30, 30, 50, 0.5);

        .url-row .input-group {

            border-radius: 12px;
            font-family: monospace;
            font-size: 14px;
            word-break: break-all;
            margin: 6px 0 4px;
            color: var(--text-primary);
            min-height: 36px;
            border: 1px solid var(--border-light);
        }
        .tool-modal-content .tool-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .tool-modal-content .tool-row button {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            background: #0078d4;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        .tool-modal-content .tool-row button:hover { background: #0067b8; transform: scale(1.02); }
        .tool-modal-content .tool-row button.secondary {
            background: var(--tag-bg);
            color: var(--text-secondary);
        }
        .tool-modal-content .tool-row button.secondary:hover { background: var(--input-bg); }

        .feedback-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0078d4;
            color: #fff;
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,120,212,0.3);
            transition: 0.2s;
            z-index: 100;
        }
        .feedback-btn:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(0,120,212,0.4); }

        .view-feedback-btn {
            position: fixed;
            bottom: 76px;
            right: 24px;
            background: var(--tag-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        .view-feedback-btn:hover { background: var(--input-bg); transform: scale(1.02); }

        @media (max-width: 992px) {
            .main-grid {
                grid-template-columns: 1fr 2.2fr 1fr;
                gap: 14px;
            }
        }
        @media (max-width: 820px) {
            .main-grid {
                grid-template-columns: 1fr 1.8fr 1fr;
                gap: 12px;
            }
            .nav-card { padding: 20px 18px 18px; }
            .search-area .input-group input { font-size: 16px; }
            .game-iframe-wrapper.active { height: 280px; }
        }
        @media (max-width: 680px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .side-col { order: 2; }
            .center-col { order: 1; }
            .nav-card { padding: 16px 14px 14px; border-radius: 28px; }
            .logo { font-size: 20px; }
            .header { flex-direction: column; align-items: stretch; gap: 8px; }
            .header-actions { justify-content: center; }
            .search-area .input-group { flex-wrap: wrap; background: transparent; border: none; padding: 0; box-shadow: none; gap: 8px; }
            .search-area .input-group input {
                background: var(--input-bg);
                border-radius: 60px;
                padding: 12px 18px;
                border: 2px solid rgba(0,120,212,0.10);
                flex: 1 1 100%;
                font-size: 15px;
            }
            .search-area .input-group .icon { display: none; }
            .search-area .input-group .btn { flex: 1 1 100%; justify-content: center; padding: 12px; }
            .url-row .input-group { flex-wrap: wrap; background: transparent; border: none; padding: 0; gap: 8px; }
            .url-row .input-group input {
                background: var(--input-bg);
                border-radius: 60px;
                padding: 10px 16px;
                border: 2px solid rgba(44,122,90,0.10);
                flex: 1 1 100%;
            }
            .url-row .input-group .btn { flex: 1 1 100%; justify-content: center; padding: 10px; }
            .game-iframe-wrapper.active { height: 240px; }
            .footer-hint { gap: 4px 10px; font-size: 12px; }
            .stats-bar { font-size: 12px; gap: 10px; }
            .feedback-btn { bottom: 14px; right: 14px; padding: 6px 14px; font-size: 12px; }
            .view-feedback-btn { bottom: 64px; right: 14px; padding: 4px 12px; font-size: 11px; }
            .hot-section-center .hot-tag { font-size: 12px; padding: 3px 12px; }

        @media (max-width: 400px) {

            .weather-iframe { height: 120px; }
        }

</head>
<body>

    <main class="nav-card" role="main">

        <!-- 顶部栏 -->
        <header class="header">
            <div class="logo">🧭 StartHere <span class="badge">导航</span></div>

                <button class="theme-toggle" id="themeToggle" title="切换深色/浅色模式">🌓</button>
                <div class="engine-selector">

        <!-- 数据看板 -->
        <div class="stats-bar">
            <span class="stat-item">📚 已收录 <span class="stat-number" id="totalSites">23</span></span>
            <span class="stat-item">🆕 本周 <span class="stat-number" id="weeklyNew">3</span></span>
            <span class="stat-item">👁️ 访问 <span class="stat-number" id="totalVisits">0</span></span>
            <span class="stat-item">💬 反馈 <span class="stat-number" id="feedbackCount">0</span></span>
        </div>

        <!-- 三栏主布局 -->
        <div class="main-grid">

            <!-- 左栏 -->
            <aside class="side-col">

                <!-- 工具矩阵 -->
                <div class="widget-box">
                    <h3>🔧 工具</h3>
                    <div class="tools-bar">
                        <button class="tool-btn" data-tool="password">🔑 密码</button>
                        <button class="tool-btn" onclick="window.open('/qr.html','_blank')">📱 二维码</button>
                        <button class="tool-btn" data-tool="timestamp">⏱️ 时间戳</button>
                        <button class="tool-btn" data-tool="regex">📝 正则</button>
                    </div>
                </div>

                <!-- 游戏中心 -->
                <div class="widget-box">
                    <h3>🎮 游戏中心</h3>
                    <button class="game-toggle-btn" id="gameToggleBtn">展开列表</button>
                    <div class="game-grid" id="gameGrid"></div>
                    <div class="game-iframe-wrapper" id="gameIframeWrapper">
                        <iframe id="gameIframe" src="about:blank" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" loading="lazy" title="游戏内嵌窗口"></iframe>
                    </div>
                </div>

            </aside>

            <!-- 中间栏（核心） -->
            <section class="center-col">

                <!-- 搜索框 -->
                <div class="search-area">
                    <form id="searchForm" class="input-group" role="search">
                        <span class="icon" aria-hidden="true">🔍</span>
                        <input type="text" id="searchInput" placeholder="输入关键词..." autocomplete="off" />
                        <button type="submit" class="btn" id="searchBtn"><span>搜索</span></button>
                    </form>
                    <div class="search-suggestions" id="searchSuggestions"></div>
                </div>

                <!-- 搜索模式切换 -->
                <nav class="search-mode-bar" aria-label="搜索模式">
                    <button class="search-mode-btn active" data-mode="web" id="modeWeb">🌐 网页</button>
                    <button class="search-mode-btn" data-mode="agg" id="modeAgg">📊 聚合</button>
                    <button class="search-mode-btn" data-mode="site" id="modeSite">📁 站内</button>
                    <span class="search-mode-hint" id="modeHint">跳转到搜索引擎</span>
                </nav>

                <!-- 站内搜索结果 -->
                <div class="site-search-results" id="siteResults" role="region" aria-live="polite"></div>

                <!-- URL直达 -->
                <div class="url-row">
                    <form id="urlForm" class="input-group" role="form">
                        <span class="icon" aria-hidden="true" style="color:var(--text-muted); font-size:16px;">🔗</span>
                        <input type="text" id="urlInput" placeholder="直接输入网址，如 github.com" autocomplete="off" spellcheck="false" />
                        <button type="submit" class="btn">前往</button>
                    </form>
                </div>

                <!-- 猜你想搜（中间栏底部，横向换行） -->
                <div class="hot-section-center" id="hotSectionCenter">
                    <div class="hot-header">🔥 猜你想搜</div>
                    <div class="hot-tags" id="hotTagsCenter"></div>
                </div>

            </section>

            <!-- 右栏 -->
            <aside class="side-col">

                <!-- 天气 -->
                <div class="widget-box">
                    <h3>🌤️ 天气</h3>
                    <iframe id="weatherIframe" class="weather-iframe" src="https://wttr.in/北京?lang=zh&m&0"></iframe>
                    <div class="weather-control">
                        <input type="text" id="cityIframe" placeholder="城市" value="北京" />
                        <button id="updateIframe">更新</button>
                    </div>
                </div>

                <!-- 日历 -->
                <div class="widget-box">
                    <h3>📅 日历</h3>
                    <div id="calendarContainer">
                        <div class="calendar-header">
                            <button class="nav-btn" id="prevMonth">‹</button>
                            <span class="month-year" id="monthYear"></span>
                            <button class="nav-btn" id="nextMonth">›</button>
                        </div>
                        <div class="calendar-grid" id="calendarGrid"></div>
                    </div>
                </div>

            </aside>

        </div>

        <!-- 底部（含B站和GitHub入口） -->
        <footer class="footer-hint">
            <span>⌨️ <kbd>/</kbd> 搜索</span>
            <span class="sep">·</span>
            <span><kbd>Esc</kbd> 清空</span>
            <span class="sep">·</span>
            <span><a href="/about.html">📖 关于</a></span>
            <span class="sep">·</span>
            <span><a href="/wiki.html">📚 指南(wiki)</a></span>
            <span class="sep">·</span>
            <span><a href="/math.html">🧮 数学</a></span>
            <span class="sep">·</span>
            <span><a href="/fileview.html">📂 文件</a></span>
            <span class="sep">·</span>
            <span><a href="#" id="feedbackLink">💬 反馈</a></span>
            <span class="sep">·</span>
            <span><a href="https://space.bilibili.com/3546946251786558" target="_blank">🎮 B站</a></span>
            <span class="sep">·</span>
            <span><a href="https://github.com/yangmaoamo45" target="_blank">🐙 GitHub</a></span>
        </footer>

        <div class="copyright">© 2026 yang工作室 版权所有</div>

    </main>

    <!-- 工具模态框 -->
    <div class="tool-modal" id="toolModal">
        <div class="tool-modal-content" id="toolModalContent">
            <div style="display:flex; align-items:center; justify-content:space-between;">
                <h2 id="toolModalTitle">🔧 工具</h2>
                <button class="close-btn" id="toolModalClose">×</button>
            </div>
            <div id="toolModalBody"></div>
        </div>
    </div>

    <!-- 反馈按钮 -->
    <button class="feedback-btn" id="feedbackBtn">💬 建议</button>
    <button class="view-feedback-btn" id="viewFeedbackBtn">📋 反馈</button>

    <script>
        (function() {
            'use strict';

            const FEEDBACK_STORAGE_KEY = 'starthere_feedback_list';

            // 深色/浅色模式
            const themeToggle = document.getElementById('themeToggle');
            const savedTheme = localStorage.getItem('starthere-theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌓';
            }
            themeToggle.addEventListener('click', function() {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('starthere-theme', next);
                themeToggle.textContent = next === 'dark' ? '☀️' : '🌓';
            });

            // 搜索建议
            const searchInput = document.getElementById('searchInput');
            const suggestionsBox = document.getElementById('searchSuggestions');
            const searchSuggestions = ['百度一下', '哔哩哔哩', '抖音', '小红书', '淘宝', '腾讯视频', '爱奇艺', '网易云音乐', '汽车之家'];

            searchInput.addEventListener('input', function() {
                const val = this.value.trim();
                if (val.length === 0) { suggestionsBox.classList.remove('active'); return; }
                const matched = searchSuggestions.filter(s => s.includes(val));
                if (matched.length === 0) { suggestionsBox.classList.remove('active'); return; }
                suggestionsBox.innerHTML = matched.map(m => `<div class="sug-item" data-val="${m}">${m}</div>`).join('');
                suggestionsBox.classList.add('active');
            });

            suggestionsBox.addEventListener('click', function(e) {
                const item = e.target.closest('.sug-item');
                if (item) {
                    searchInput.value = item.dataset.val;
                    suggestionsBox.classList.remove('active');
                    document.getElementById('searchForm').dispatchEvent(new Event('submit'));
                }
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.search-area')) {
                    suggestionsBox.classList.remove('active');
                }
            });

            // 数据展示
            const totalSitesEl = document.getElementById('totalSites');
            const weeklyNewEl = document.getElementById('weeklyNew');
            const totalVisitsEl = document.getElementById('totalVisits');
            const feedbackCountEl = document.getElementById('feedbackCount');

            let visits = parseInt(localStorage.getItem('starthere-visits') || '0');
            visits = visits ? visits + 1 : 1;
            localStorage.setItem('starthere-visits', String(visits));
            totalVisitsEl.textContent = visits;

            function updateFeedbackCount() {
                const list = JSON.parse(localStorage.getItem(FEEDBACK_STORAGE_KEY) || '[]');
                feedbackCountEl.textContent = list.length;
            }
            updateFeedbackCount();

            // 工具模态框
            const toolModal = document.getElementById('toolModal');
            const toolModalContent = document.getElementById('toolModalContent');
            const toolModalTitle = document.getElementById('toolModalTitle');
            const toolModalBody = document.getElementById('toolModalBody');
            const toolModalClose = document.getElementById('toolModalClose');

            function openTool(tool) {
                toolModal.classList.add('active');
                let html = '';
                if (tool === 'password') {
                    toolModalTitle.textContent = '🔑 密码生成器';
                    html = `
                        <label>密码长度</label>
                        <input type="number" id="pwdLength" value="12" min="4" max="64" />
                        <div style="margin:6px 0; display:flex; gap:10px; flex-wrap:wrap;">
                            <label style="font-size:13px;"><input type="checkbox" id="pwdUpper" checked /> 大写</label>
                            <label style="font-size:13px;"><input type="checkbox" id="pwdLower" checked /> 小写</label>
                            <label style="font-size:13px;"><input type="checkbox" id="pwdNumber" checked /> 数字</label>
                            <label style="font-size:13px;"><input type="checkbox" id="pwdSymbol" /> 符号</label>
                        </div>
                        <button id="genPwdBtn" style="padding:8px 20px; border-radius:30px; border:none; background:#0078d4; color:#fff; cursor:pointer;">生成</button>
                        <div class="tool-output" id="pwdResult">点击生成</div>
                        <button class="secondary" id="copyPwdBtn" style="padding:6px 18px; border-radius:30px; border:1px solid var(--border-light); background:var(--tag-bg); color:var(--text-secondary); cursor:pointer;">📋 复制</button>
                    `;
                } else if (tool === 'timestamp') {
                    toolModalTitle.textContent = '⏱️ 时间戳转换';
                    html = `
                        <label>当前时间戳</label>
                        <div class="tool-output" id="currentTs">${Math.floor(Date.now()/1000)}</div>
                        <label>输入时间戳（秒）</label>
                        <input type="text" id="tsInput" placeholder="1700000000" />
                        <button id="tsConvertBtn" style="padding:8px 20px; border-radius:30px; border:none; background:#0078d4; color:#fff; cursor:pointer;">转换</button>
                        <div class="tool-output" id="tsResult">输入时间戳后点击转换</div>
                    `;
                } else if (tool === 'regex') {
                    toolModalTitle.textContent = '📝 正则表达式测试';
                    html = `
                        <label>正则表达式</label>
                        <input type="text" id="regexPattern" placeholder="\\d+" value="\\d+" />
                        <label>测试文本</label>
                        <textarea id="regexText" rows="3" placeholder="输入要测试的文本...">abc123def456</textarea>
                        <button id="regexTestBtn" style="padding:8px 20px; border-radius:30px; border:none; background:#0078d4; color:#fff; cursor:pointer;">测试</button>
                        <div class="tool-output" id="regexResult">点击测试查看匹配结果</div>
                    `;
                }
                toolModalBody.innerHTML = html;
                if (tool === 'password') {
                    document.getElementById('genPwdBtn').addEventListener('click', generatePassword);
                    document.getElementById('copyPwdBtn').addEventListener('click', function() {
                        const result = document.getElementById('pwdResult').textContent;
                        if (result && result !== '点击生成') {
                            navigator.clipboard?.writeText(result).then(() => {
                                this.textContent = '✅ 已复制';
                                setTimeout(() => { this.textContent = '📋 复制'; }, 1500);
                            });
                        }
                    });
                    generatePassword();
                } else if (tool === 'timestamp') {
                    document.getElementById('tsConvertBtn').addEventListener('click', convertTimestamp);
                } else if (tool === 'regex') {
                    document.getElementById('regexTestBtn').addEventListener('click', testRegex);
                }
            }

            function generatePassword() {
                const length = parseInt(document.getElementById('pwdLength').value) || 12;
                const upper = document.getElementById('pwdUpper').checked;
                const lower = document.getElementById('pwdLower').checked;
                const number = document.getElementById('pwdNumber').checked;
                const symbol = document.getElementById('pwdSymbol').checked;
                let chars = '';
                if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                if (lower) chars += 'abcdefghijklmnopqrstuvwxyz';
                if (number) chars += '0123456789';
                if (symbol) chars += '!@#$%^&*()_+-=';
                if (!chars) { document.getElementById('pwdResult').textContent = '请至少选择一种字符类型'; return; }
                let pwd = '';
                for (let i = 0; i < length; i++) {
                    pwd += chars[Math.floor(Math.random() * chars.length)];
                }
                document.getElementById('pwdResult').textContent = pwd;
            }

            function convertTimestamp() {
                const input = document.getElementById('tsInput').value.trim();
                if (!input) { document.getElementById('tsResult').textContent = '请输入时间戳'; return; }
                const ts = parseInt(input);
                if (isNaN(ts)) { document.getElementById('tsResult').textContent = '请输入有效的数字'; return; }
                const date = new Date(ts * 1000);
                if (isNaN(date.getTime())) { document.getElementById('tsResult').textContent = '无效的时间戳'; return; }
                document.getElementById('tsResult').textContent = date.toLocaleString('zh-CN');
            }

            function testRegex() {
                const pattern = document.getElementById('regexPattern').value;
                const text = document.getElementById('regexText').value;
                if (!pattern || !text) { document.getElementById('regexResult').textContent = '请填写正则表达式和测试文本'; return; }
                try {
                    const regex = new RegExp(pattern, 'g');
                    const matches = text.match(regex);
                    if (matches) {
                        document.getElementById('regexResult').textContent = '匹配结果: ' + JSON.stringify(matches);
                    } else {
                        document.getElementById('regexResult').textContent = '没有匹配到任何内容';
                    }
                } catch (e) {
                    document.getElementById('regexResult').textContent = '❌ 正则表达式错误: ' + e.message;
                }
            }

            document.querySelectorAll('[data-tool]').forEach(btn => {
                btn.addEventListener('click', function() {
                    openTool(this.dataset.tool);
                });
            });

            toolModalClose.addEventListener('click', function() {
                toolModal.classList.remove('active');
            });
            toolModal.addEventListener('click', function(e) {
                if (e.target === toolModal) toolModal.classList.remove('active');
            });

            // 反馈功能
            function openFeedback() {
                toolModal.classList.add('active');
                toolModalTitle.textContent = '💬 提交反馈 / 修改建议';
                toolModalBody.innerHTML = `
                    <form id="feedbackForm">
                        <label>你的建议类型</label>
                        <select id="feedbackType" style="width:100%; padding:10px 14px; border-radius:16px; border:1px solid var(--border-light); background:var(--input-bg); color:var(--text-primary); font-size:14px; outline:none;">
                            <option value="功能建议">💡 功能建议</option>
                            <option value="报错反馈">🐛 报错反馈</option>
                            <option value="收录申请">📥 收录申请</option>
                            <option value="修改建议">✏️ 修改建议</option>
                        </select>

                        <label style="margin-top:10px;">内容</label>
                        <textarea id="feedbackContent" rows="4" placeholder="请详细描述你的建议、报错信息或要收录的网站..." style="width:100%; padding:10px 14px; border-radius:16px; border:1px solid var(--border-light); background:var(--input-bg); color:var(--text-primary); font-size:14px; outline:none; font-family:inherit;"></textarea>

                        <div id="modifyFields" style="display:none; margin-top:10px;">
                            <label>要修改的文件</label>
                            <select id="modifyFile" style="width:100%; padding:10px 14px; border-radius:16px; border:1px solid var(--border-light); background:var(--input-bg); color:var(--text-primary); font-size:14px; outline:none;">
                                <option value="index.html">导航页</option>
                                <option value="about.html">关于作者</option>
                                <option value="wiki.html">使用指南</option>
                                <option value="fileview.html">文件查看器</option>
                                <option value="math.html">数学实验</option>
                                <option value="其他">其他</option>
                            </select>
                            <label style="margin-top:8px;">修改内容描述</label>
                            <textarea id="modifyContent" rows="3" placeholder="请详细描述要修改的内容..." style="width:100%; padding:10px 14px; border-radius:16px; border:1px solid var(--border-light); background:var(--input-bg); color:var(--text-primary); font-size:14px; outline:none; font-family:inherit;"></textarea>
                        </div>

                        <label style="margin-top:8px;">联系方式（选填）</label>
                        <input type="text" id="feedbackContact" placeholder="邮箱或微信号" style="width:100%; padding:10px 14px; border-radius:16px; border:1px solid var(--border-light); background:var(--input-bg); color:var(--text-primary); font-size:14px; outline:none;" />

                        <div class="tool-row" style="margin-top:12px;">
                            <button type="submit">提交</button>
                            <button type="reset" class="secondary">清空</button>
                        </div>
                    </form>
                    <div id="feedbackResult" style="margin-top:8px; font-size:14px; color:var(--text-muted);"></div>
                `;

                document.getElementById('feedbackType').addEventListener('change', function() {
                    const show = this.value === '修改建议';
                    document.getElementById('modifyFields').style.display = show ? 'block' : 'none';
                });

                document.getElementById('feedbackForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    const type = document.getElementById('feedbackType').value;
                    const content = document.getElementById('feedbackContent').value.trim();
                    const contact = document.getElementById('feedbackContact').value.trim();
                    const resultEl = document.getElementById('feedbackResult');

                    if (type === '修改建议') {
                        const file = document.getElementById('modifyFile').value;
                        const modifyContent = document.getElementById('modifyContent').value.trim();
                        if (!modifyContent) {
                            resultEl.textContent = '⚠️ 请填写修改内容';
                            resultEl.style.color = '#e0455a';
                            return;
                        }
                        let fileName = file;
                        if (file === '其他') {
                            fileName = prompt('请输入要修改的文件名：');
                            if (!fileName) return;
                        }
                        if (confirm(`将跳转到 GitHub 编辑：\n文件：${fileName}\n\n点击确定继续。`)) {
                            window.open(`https://github.com/yangmaoamo45/StartHere/edit/main/${fileName}`, '_blank');
                            toolModal.classList.remove('active');
                        }
                        return;
                    }

                    if (!content) {
                        resultEl.textContent = '⚠️ 请填写内容';
                        resultEl.style.color = '#e0455a';
                        return;
                    }
                    const feedbackList = JSON.parse(localStorage.getItem(FEEDBACK_STORAGE_KEY) || '[]');
                    feedbackList.push({
                        id: Date.now(),
                        type: type,
                        content: content,
                        contact: contact || '未提供',
                        time: new Date().toLocaleString('zh-CN')
                    });
                    localStorage.setItem(FEEDBACK_STORAGE_KEY, JSON.stringify(feedbackList));
                    updateFeedbackCount();
                    resultEl.textContent = '✅ 反馈已保存！点击「查看反馈」可查看所有记录。';
                    resultEl.style.color = '#2a9d7a';
                    document.getElementById('feedbackContent').value = '';
                    document.getElementById('feedbackContact').value = '';
                });
            }

            document.getElementById('feedbackBtn').addEventListener('click', openFeedback);
            document.getElementById('feedbackLink').addEventListener('click', function(e) {
                e.preventDefault();
                openFeedback();
            });

            // 查看反馈
            document.getElementById('viewFeedbackBtn').addEventListener('click', function() {
                const list = JSON.parse(localStorage.getItem(FEEDBACK_STORAGE_KEY) || '[]');
                toolModal.classList.add('active');
                toolModalContent.classList.add('feedback-list-modal');
                toolModalTitle.textContent = '📋 所有反馈记录';

                if (list.length === 0) {
                    toolModalBody.innerHTML = `<div class="empty-feedback" style="text-align:center;padding:30px 0;color:var(--text-light);">📭 暂无反馈记录</div>`;
                } else {
                    let html =
                        `<div style="margin-bottom:8px;font-size:13px;color:var(--text-muted);">共 ${list.length} 条</div>`;
                    const reversed = [...list].reverse();
                    reversed.forEach(item => {
                        html += `
                            <div class="feedback-item" style="padding:10px 14px;border-bottom:1px solid var(--border-light);font-size:14px;color:var(--text-secondary);">
                                <div class="fb-meta" style="font-size:12px;color:var(--text-light);margin-bottom:4px;">
                                    <span class="fb-type" style="display:inline-block;background:rgba(0,120,212,0.08);padding:0 10px;border-radius:12px;font-size:12px;color:#0078d4;margin-right:8px;">${item.type}</span>
                                    ${item.time}
                                    ${item.contact !== '未提供' ? `· 📧 ${item.contact}` : ''}
                                </div>
                                <div class="fb-content" style="color:var(--text-primary);">${item.content}</div>
                            </div>
                        `;
                    });
                    html += `
                        <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
                            <button class="export-btn" id="exportFeedbackBtn" style="padding:6px 16px;border-radius:30px;border:1px solid var(--border-light);background:var(--tag-bg);cursor:pointer;font-size:13px;color:var(--text-secondary);">📤 导出</button>
                            <button class="export-btn" id="clearFeedbackBtn" style="padding:6px 16px;border-radius:30px;border:1px solid var(--border-light);background:var(--tag-bg);cursor:pointer;font-size:13px;color:#e0455a;">🗑️ 清空</button>
                        </div>
                    `;
                    toolModalBody.innerHTML = html;

                    document.getElementById('exportFeedbackBtn').addEventListener('click', function() {
                        const data = JSON.parse(localStorage.getItem(FEEDBACK_STORAGE_KEY) || '[]');
                        const text = data.map(item =>
                            `[${item.time}] ${item.type}\n内容: ${item.content}\n联系方式: ${item.contact}\n---`
                        ).join('\n');
                        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = `反馈记录_${new Date().toISOString().slice(0,10)}.txt`;
                        a.click();
                        URL.revokeObjectURL(a.href);
                    });

                    document.getElementById('clearFeedbackBtn').addEventListener('click', function() {
                        if (confirm('确定要清空所有反馈记录吗？')) {
                            localStorage.removeItem(FEEDBACK_STORAGE_KEY);
                            updateFeedbackCount();
                            document.getElementById('viewFeedbackBtn').click();
                        }
                    });
                }
                toolModalClose.onclick = function() {
                    toolModalContent.classList.remove('feedback-list-modal');
                    toolModal.classList.remove('active');
                };
                toolModal.onclick = function(e) {
                    if (e.target === toolModal) {
                        toolModalContent.classList.remove('feedback-list-modal');
                        toolModal.classList.remove('active');
                    }
                };
            });

            // 天气
            const cityInput = document.getElementById('cityIframe');
            const updateBtn = document.getElementById('updateIframe');
            const weatherIframe = document.getElementById('weatherIframe');

            function updateWeather() {
                const city = cityInput.value.trim() || '北京';
                weatherIframe.src = `https://wttr.in/${encodeURIComponent(city)}?lang=zh&m&0`;
            }
            updateBtn.addEventListener('click', updateWeather);
            cityInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') updateWeather();
            });

            // 日历
            let currentDate = new Date();
            let currentYear = currentDate.getFullYear();
            let currentMonth = currentDate.getMonth();
            const monthYearEl = document.getElementById('monthYear');
            const calendarGrid = document.getElementById('calendarGrid');
            const prevMonthBtn = document.getElementById('prevMonth');
            const nextMonthBtn = document.getElementById('nextMonth');

            function renderCalendar(year, month) {
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const daysInPrevMonth = new Date(year, month, 0).getDate();
                const today = new Date();
                const todayDate = today.getDate();
                const todayMonth = today.getMonth();
                const todayYear = today.getFullYear();

                const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
                monthYearEl.textContent = `${year}年 ${monthNames[month]}`;

                let html = '';
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                weekdays.forEach(w => { html += `<div class="weekday">${w}</div>`; });

                const startOffset = firstDay === 0 ? 6 : firstDay - 1;
                const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
                let day = 1;
                let prevDay = daysInPrevMonth - startOffset + 1;

                for (let i = 0; i < totalCells; i++) {
                    let cls = 'day';
                    let dayNumber;
                    if (i < startOffset) {
                        dayNumber = prevDay++;
                        cls += ' other-month';
                    } else if (day <= daysInMonth) {
                        dayNumber = day++;
                        if (year === todayYear && month === todayMonth && dayNumber === todayDate) {
                            cls += ' today';
                        }
                    } else {
                        dayNumber = (day++ - daysInMonth);
                        cls += ' other-month';
                    }
                    html += `<div class="${cls}" data-day="${dayNumber}">${dayNumber}</div>`;
                }
                calendarGrid.innerHTML = html;
            }

            function changeMonth(delta) {
                currentMonth += delta;
                if (currentMonth < 0) { currentMonth = 11;
                    currentYear--; } else if (currentMonth > 11) { currentMonth =
                    0;
                    currentYear++; }
                renderCalendar(currentYear, currentMonth);
            }

            prevMonthBtn.addEventListener('click', function() { changeMonth(-1); });
            nextMonthBtn.addEventListener('click', function() { changeMonth(1); });

            calendarGrid.addEventListener('click', function(e) {
                const dayEl = e.target.closest('.day');
                if (dayEl && !dayEl.classList.contains('other-month')) {
                    alert(`你选择了 ${currentYear}年${currentMonth+1}月${dayEl.dataset.day}日`);
                }
            });

            renderCalendar(currentYear, currentMonth);

            // 热门链接（中间栏底部）
            const HOT_ITEMS_MAP = {
                'CCTV1在线直播': { url: 'https://tv.cctv.com/live/cctv1/', desc: '📺 综合' },
                'CCTV2财经': { url: 'https://tv.cctv.com/live/cctv2/', desc: '📊 财经' },
                'CCTV3综艺': { url: 'https://tv.cctv.com/live/cctv3/', desc: '🎭 综艺' },
                'CCTV4中文国际': { url: 'https://tv.cctv.com/live/cctv4/', desc: '🌏 国际' },
                'CCTV5体育': { url: 'https://tv.cctv.com/live/cctv5/', desc: '⚽ 体育' },
                'CCTV6电影': { url: 'https://tv.cctv.com/live/cctv6/', desc: '🎬 电影' },
                '国家中小学智慧教育': { url: 'https://basic.smartedu.cn/', desc: '📚 教育' },
                '国家法律法规数据库': { url: 'https://flk.npc.gov.cn/', desc: '⚖️ 法律' },
                '百度一下': { url: 'https://www.baidu.com', desc: '🔍 搜索' },
                '哔哩哔哩': { url: 'https://www.bilibili.com', desc: '🎮 B站' },
                '抖音': { url: 'https://www.douyin.com', desc: '📱 短视频' },
                '小红书': { url: 'https://www.xiaohongshu.com', desc: '📖 社区' },
                '淘宝': { url: 'https://www.taobao.com', desc: '🛒 购物' },
                '腾讯视频': { url: 'https://v.qq.com', desc: '🎥 影视' },
                '爱奇艺': { url: 'https://www.iqiyi.com', desc: '🎬 剧集' },
                '网易云音乐': { url: 'https://music.163.com', desc: '🎵 音乐' },
                '汽车之家': { url: 'https://www.autohome.com.cn', desc: '🚗 汽车' },
                '直播中国': { url: 'https://livechina.cctv.com/', desc: '🇨🇳 直播' },
            };
            const HOT_ITEMS = Object.keys(HOT_ITEMS_MAP);

            const hotTagsCenter = document.getElementById('hotTagsCenter');
            HOT_ITEMS.forEach(item => {
                const info = HOT_ITEMS_MAP[item];
                const span = document.createElement('span');
                span.className = 'hot-tag';
                span.innerHTML = `${item} <span class="tag-desc">${info.desc}</span>`;
                span.dataset.url = info.url;
                hotTagsCenter.appendChild(span);
            });
            hotTagsCenter.addEventListener('click', function(e) {
                const tag = e.target.closest('.hot-tag');
                if (tag && tag.dataset.url) window.open(tag.dataset.url, '_blank');
            });

            // 游戏
            const GAMES = [
                { name: 'Scratch 作品', file: 'Scratch_ (1) _ (1) (1).html' },
                { name: '作品 (3)', file: '作品_ (3) .html' },
                { name: '几何冲刺 (5) (1)', file: '几何冲刺_ (5) (1) .html' },
                { name: '几何冲刺 (5) (2)', file: '几何冲刺_ (5)  (2) .html' },
                { name: '抽奖机', file: '抽奖机 (不要赌博)_ (2) (1).html' },
                { name: '苟活之重生', file: '苟活之重生.html' }
            ];

            const gameGrid = document.getElementById('gameGrid');
            const gameToggleBtn = document.getElementById('gameToggleBtn');
            const gameIframeWrapper = document.getElementById('gameIframeWrapper');
            const gameIframe = document.getElementById('gameIframe');
            let isGameGridOpen = false;

            GAMES.forEach((game) => {
                const div = document.createElement('div');
                div.className = 'game-item';
                div.textContent = game.name;
                div.dataset.file = game.file;
                gameGrid.appendChild(div);
            });

            gameGrid.addEventListener('click', function(e) {
                const item = e.target.closest('.game-item');
                if (!item) return;
                const file = item.dataset.file;
                if (file) {
                    gameIframe.src = './games/' + file;
                    gameIframeWrapper.classList.add('active');
                    document.querySelectorAll('.game-item').forEach(el => {
                        el.classList.toggle('active-game', el.dataset.file === file);
                    });
                    if (!isGameGridOpen) toggleGameGrid(true);
                }
            });

            function toggleGameGrid(forceOpen) {
                const willOpen = (forceOpen !== undefined) ? forceOpen : !isGameGridOpen;
                if (willOpen) {
                    gameGrid.classList.add('active');
                    gameToggleBtn.textContent = '收起列表';
                    isGameGridOpen = true;
                } else {
                    gameGrid.classList.remove('active');
                    gameToggleBtn.textContent = '展开列表';
                    isGameGridOpen = false;
                }
            }
            gameToggleBtn.addEventListener('click', function() { toggleGameGrid(); });

            // 搜索功能
            const ENGINES = {
                bing: { name: '必应', url: 'https://www.bing.com/search?q=' },
                baidu: { name: '百度', url: 'https://www.baidu.com/s?wd=' },
                google: { name: 'Google', url: 'https://www.google.com/search?q=' },
                sogou: { name: '搜狗', url: 'https://www.sogou.com/web?query=' },
                '360': { name: '360搜索', url: 'https://www.so.com/s?q=' }
            };

            const engineSelect = document.getElementById('engineSelect');
            const searchForm = document.getElementById('searchForm');
            const searchBtn = document.getElementById('searchBtn');
            const modeWeb = document.getElementById('modeWeb');
            const modeAgg = document.getElementById('modeAgg');
            const modeSite = document.getElementById('modeSite');
            const modeHint = document.getElementById('modeHint');
            const siteResults = document.getElementById('siteResults');
            const urlForm = document.getElementById('urlForm');
            const urlInput = document.getElementById('urlInput');

            let currentMode = 'web';
            let searchQuery = '';

            function setMode(mode) {
                currentMode = mode;
                [modeWeb, modeAgg, modeSite].forEach(btn => btn.classList.remove('active'));
                if (mode === 'web') {
                    modeWeb.classList.add('active');
                    modeHint.textContent = '跳转到所选搜索引擎';
                } else if (mode === 'agg') {
                    modeAgg.classList.add('active');
                    modeHint.textContent = '同时打开多个搜索引擎';
                } else if (mode === 'site') {
                    modeSite.classList.add('active');
                    modeHint.textContent = '站内搜索（热门/游戏）';
                    siteResults.innerHTML = '';
                    siteResults.classList.remove('active');
                    searchInput.focus();
                }
                if (mode === 'site' && searchQuery) {
                    doSiteSearch(searchQuery);
                } else {
                    siteResults.classList.remove('active');
                    siteResults.innerHTML = '';
                }
            }

            function performSearch(query) {
                if (!query || !query.trim()) { searchInput.focus(); return; }
                const trimmed = query.trim();
                searchQuery = trimmed;

                if (currentMode === 'web') {
                    const engineKey = engineSelect.value;
                    const engine = ENGINES[engineKey];
                    if (!engine) return;
                    window.open(engine.url + encodeURIComponent(trimmed), '_blank');
                } else if (currentMode === 'agg') {
                    const selected = new Set([engineSelect.value, 'bing', 'baidu', 'google']);
                    const targets = Object.keys(ENGINES).filter(k => selected.has(k));
                    targets.forEach(key => {
                        const eng = ENGINES[key];
                        if (eng) window.open(eng.url + encodeURIComponent(trimmed), '_blank');
                    });
                    searchBtn.innerHTML = '<span>✓ 已打开</span>';
                    setTimeout(() => { searchBtn.innerHTML = '<span>搜索</span>'; }, 800);
                } else if (currentMode === 'site') {
                    doSiteSearch(trimmed);
                }
            }

            function doSiteSearch(query) {
                const results = [];
                const lower = query.toLowerCase();
                HOT_ITEMS.forEach(item => {
                    if (item.toLowerCase().includes(lower)) {
                        results.push({ type: '热门', name: item, url: HOT_ITEMS_MAP[item].url, desc: HOT_ITEMS_MAP[item]
                                .desc });
                    }
                });
                GAMES.forEach(game => {
                    if (game.name.toLowerCase().includes(lower)) {
                        results.push({ type: '游戏', name: game.name, url: './games/' + game.file, desc: '点击加载' });
                    }
                });

                if (results.length === 0) {
                    siteResults.innerHTML = '<div class="no-result">😅 未找到相关内容</div>';
                } else {
                    let html = '';
                    results.forEach((res) => {
                        let displayName = res.name;
                        const idx = displayName.toLowerCase().indexOf(lower);
                        if (idx !== -1) {
                            const before = displayName.substring(0, idx);
                            const match = displayName.substring(idx, idx + lower.length);
                            const after = displayName.substring(idx + lower.length);
                            displayName = before + '<strong style="color:#0078d4;">' + match + '</strong>' + after;
                        }
                        html += `
                            <div class="result-item" data-url="${res.url}" data-type="${res.type}">
                                <span>${displayName}</span>
                                <span class="tag">${res.type}</span>
                                <span class="desc">${res.desc}</span>
                            </div>
                        `;
                    });
                    siteResults.innerHTML = html;
                    siteResults.querySelectorAll('.result-item').forEach(el => {
                        el.addEventListener('click', function() {
                            const url = this.dataset.url;
                            const type = this.dataset.type;
                            if (url) {
                                if (type === '游戏') {
                                    const fileName = url.split('/').pop();
                                    const gameItem = document.querySelector(`.game-item[data-file="${fileName}"]`);
                                    if (gameItem) { gameItem.click(); }
                                } else {
                                    window.open(url, '_blank');
                                }
                            }
                        });
                    });
                }
                siteResults.classList.add('active');
            }

            searchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const query = searchInput.value.trim();
                if (!query) { searchInput.focus(); return; }
                performSearch(query);
            });

            modeWeb.addEventListener('click', function() { setMode('web'); });
            modeAgg.addEventListener('click', function() { setMode('agg'); });
            modeSite.addEventListener('click', function() { setMode('site'); });

            // URL 直达
            function ensureProtocol(input) {
                let trimmed = input.trim();
                if (!trimmed) return null;
                if (/^https?:\/\//i.test(trimmed)) return trimmed;
                if (/^:\/\/.+/.test(trimmed)) return 'http' + trimmed;
                if (trimmed.includes('.') && !/\s/.test(trimmed)) return 'https://' + trimmed;
                return null;
            }

            urlForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const raw = urlInput.value.trim();
                if (!raw) { urlInput.focus(); return; }
                let target = ensureProtocol(raw);
                if (!target) {
                    if (raw.includes('.') || raw.includes('localhost') || raw.includes(':')) {
                        target = 'https://' + raw;
                    } else if (/^[a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?$/.test(raw)) {
                        target = 'https://' + raw + '.com';
                    } else {
                        target = 'https://' + raw;
                    }
                }
                try {
                    new URL(target);
                    window.open(target, '_blank');
                } catch (_) {
                    const fallback = 'https://' + raw.replace(/^https?:\/\//, '');
                    try {
                        new URL(fallback);
                        window.open(fallback, '_blank');
                    } catch (__) {
                        alert('无法识别该网址，将使用搜索引擎搜索 "' + raw + '"');
                        window.open('https://www.bing.com/search?q=' + encodeURIComponent(raw), '_blank');
                    }
                }
                urlInput.value = '';
            });

            // 键盘快捷键
            document.addEventListener('keydown', function(e) {
                const tag = e.target.tagName.toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') { this.value = '';
                    this.blur();
                    suggestionsBox.classList.remove('active');
                    siteResults.classList.remove('active'); }
            });
            urlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') { this.value = ''; this.blur(); }
            });

            // 初始化
            setMode('web');

            setTimeout(() => {
                if (!document.activeElement || document.activeElement === document.body) {
                    searchInput.focus();
                }
            }, 200);

            console.log('🚀 StartHere 已启动');
        })();
    </script>

</body>
