<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件查看器 · 支持解压ZIP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #0d0b1a 0%, #1a1430 100%);
            min-height: 100vh;
            padding: 20px;
            color: #f0eef7;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        header h1 {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #6fc3df, #f7c948);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-link {
            color: #b3aad6;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.2s;
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .upload-area {
            background: rgba(255, 255, 255, 0.04);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 28px;
        }
        .upload-area:hover,
        .upload-area.dragover {
            border-color: #f7c948;
            background: rgba(255, 255, 255, 0.06);
        }
        .upload-area .icon {
            font-size: 3.6rem;
            margin-bottom: 10px;
        }
        .upload-area p {
            font-size: 1.1rem;
            color: #b3aad6;
        }
        .upload-area .sub {
            font-size: 0.9rem;
            color: #6a5f8a;
            margin-top: 4px;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .preview-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 20px 24px 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            min-height: 200px;
            display: none;
            flex-direction: column;
        }
        .preview-card.active {
            display: flex;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .preview-header .file-name {
            font-weight: 600;
            font-size: 1.1rem;
            word-break: break-all;
        }
        .preview-header .file-size {
            color: #6a5f8a;
            font-size: 0.85rem;
        }
        .preview-content {
            flex: 1;
            overflow: auto;
            position: relative;
        }
        .preview-content img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .preview-content iframe {
            width: 100%;
            height: 70vh;
            border: none;
            border-radius: 12px;
            background: #fff;
        }
        .preview-content pre {
            background: rgba(0, 0, 0, 0.35);
            padding: 16px 20px;
            border-radius: 16px;
            overflow-x: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            max-height: 70vh;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Courier New', monospace;
            color: #d4cdf0;
        }
        .preview-content .placeholder-text {
            color: #6a5f8a;
            font-size: 1rem;
            text-align: center;
            padding: 40px 0;
        }
        .preview-content .error-text {
            color: #f5a0a0;
            text-align: center;
            padding: 30px 0;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .action-buttons button {
            padding: 8px 24px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .btn-download {
            background: linear-gradient(135deg, #6fc3df, #4a9ab5);
            color: #fff;
        }
        .btn-download:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 16px rgba(111, 195, 223, 0.3);
        }
        .btn-clear {
            background: rgba(255, 255, 255, 0.08);
            color: #b3aad6;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            color: #b3aad6;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .zip-file-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 4px 0;
        }
        .zip-file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: 0.15s;
        }
        .zip-file-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .zip-file-item .name {
            font-size: 0.95rem;
            color: #d4cdf0;
            word-break: break-all;
        }
        .zip-file-item .size {
            font-size: 0.8rem;
            color: #6a5f8a;
            white-space: nowrap;
            margin-left: 12px;
        }
        .zip-file-item .preview-badge {
            font-size: 0.7rem;
            background: rgba(111, 195, 223, 0.15);
            color: #6fc3df;
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 8px;
        }
        .footer-note {
            text-align: center;
            color: #6a5f8a;
            font-size: 0.8rem;
            margin-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 20px;
        }
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.6rem;
            }
            .upload-area {
                padding: 28px 16px;
            }
            .upload-area .icon {
                font-size: 2.8rem;
            }
            .zip-file-item {
                flex-wrap: wrap;
                gap: 4px;
            }
            .zip-file-item .size {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📂 文件查看器</h1>
            <a href="/" class="back-link">← 返回导航</a>
        </header>

        <div class="upload-area" id="uploadArea">
            <div class="icon">📤</div>
            <p>点击或拖拽文件到这里</p>
            <div class="sub">支持图片、文本、PDF、代码文件、ZIP压缩包（可解压浏览）</div>
            <input type="file" id="fileInput" />
        </div>

        <div class="preview-card" id="previewCard">
            <div class="preview-header">
                <span class="file-name" id="fileName">文件名</span>
                <span class="file-size" id="fileSize">大小</span>
            </div>
            <div class="preview-content" id="previewContent">
                <!-- 动态内容 -->
            </div>
            <div class="action-buttons">
                <button class="btn-download" id="downloadBtn">⬇️ 下载</button>
                <button class="btn-clear" id="clearBtn">🗑️ 清除</button>
                <button class="btn-back" id="backBtn" style="display:none;">← 返回列表</button>
            </div>
        </div>

        <footer class="footer-note">所有文件仅在浏览器本地处理，不会上传到服务器</footer>
    </div>

    <script>
        (function() {
            'use strict';

            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const previewCard = document.getElementById('previewCard');
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            const previewContent = document.getElementById('previewContent');
            const downloadBtn = document.getElementById('downloadBtn');
            const clearBtn = document.getElementById('clearBtn');
            const backBtn = document.getElementById('backBtn');

            let currentFile = null;
            let zipFiles = null;
            let currentZipIndex = -1;

            function getFileType(ext, mime) {
                const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico'];
                const textExts = ['txt', 'log', 'html', 'htm', 'css', 'xml', 'json', 'js', 'ts', 'jsx', 'tsx', 'csv', 'md',
                    'py', 'java', 'cpp', 'c', 'h', 'sh', 'bat', 'ps1', 'rb', 'go', 'rs', 'swift', 'kt', 'scala', 'pl',
                    'pm', 'r', 'lua', 'toml', 'yaml', 'yml', 'ini', 'cfg', 'conf', 'env', 'gitignore', 'dockerfile',
                    'makefile'
                ];
                const mimeText = ['text/', 'application/json', 'application/javascript', 'application/xml',
                    'application/x-yaml'
                ];

                ext = ext.toLowerCase();
                if (imageExts.includes(ext)) return 'image';
                if (ext === 'pdf') return 'pdf';
                if (ext === 'zip') return 'zip';
                if (textExts.includes(ext)) return 'text';
                if (mimeText.some(t => mime.includes(t))) return 'text';
                return 'text';
            }

            function handleFile(file) {
                currentFile = file;
                currentZipIndex = -1;
                zipFiles = null;
                const ext = file.name.split('.').pop().toLowerCase();
                const mime = file.type || '';
                const type = getFileType(ext, mime);

                fileName.textContent = file.name;
                fileSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
                previewCard.classList.add('active');
                previewContent.innerHTML = '';
                backBtn.style.display = 'none';
                downloadBtn.style.display = 'inline-block';

                if (type === 'zip') {
                    handleZipFile(file);
                    return;
                }

                if (type === 'image') {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.alt = file.name;
                        previewContent.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                } else if (type === 'pdf') {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const iframe = document.createElement('iframe');
                        iframe.src = e.target.result;
                        iframe.title = file.name;
                        previewContent.appendChild(iframe);
                    };
                    reader.readAsDataURL(file);
                } else {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const text = e.target.result;
                        const pre = document.createElement('pre');
                        pre.textContent = text;
                        previewContent.appendChild(pre);
                    };
                    reader.onerror = () => {
                        previewContent.innerHTML =
                        '<p class="error-text">❌ 无法读取文件内容（可能不是文本文件）</p>';
                    };
                    reader.readAsText(file);
                }

                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    const url = URL.createObjectURL(file);
                    a.href = url;
                    a.download = file.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                };
            }

            function handleZipFile(file) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const zip = await JSZip.loadAsync(e.target.result);
                        const files = [];
                        zip.forEach((relativePath, zipEntry) => {
                            if (!zipEntry.dir) {
                                files.push({
                                    name: relativePath,
                                    size: zipEntry._data.uncompressedSize || 0,
                                    entry: zipEntry
                                });
                            }
                        });
                        files.sort((a, b) => a.name.localeCompare(b.name));
                        zipFiles = files;
                        showZipFileList(files);
                    } catch (err) {
                        previewContent.innerHTML =
                            `<p class="error-text">❌ 解压失败：${err.message || '未知错误'}</p>`;
                        console.error(err);
                    }
                };
                reader.readAsArrayBuffer(file);
                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    const url = URL.createObjectURL(file);
                    a.href = url;
                    a.download = file.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                };
            }

            function showZipFileList(files) {
                previewContent.innerHTML = '';
                const container = document.createElement('div');
                container.className = 'zip-file-list';

                if (files.length === 0) {
                    container.innerHTML = '<p class="placeholder-text">压缩包为空</p>';
                } else {
                    files.forEach((item, index) => {
                        const div = document.createElement('div');
                        div.className = 'zip-file-item';
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'name';
                        nameSpan.textContent = item.name;
                        const sizeSpan = document.createElement('span');
                        sizeSpan.className = 'size';
                        sizeSpan.textContent = (item.size / 1024).toFixed(1) + ' KB';
                        const badge = document.createElement('span');
                        badge.className = 'preview-badge';
                        badge.textContent = '预览';
                        div.appendChild(nameSpan);
                        div.appendChild(sizeSpan);
                        div.appendChild(badge);
                        div.dataset.index = index;
                        div.addEventListener('click', () => {
                            previewZipFile(index);
                        });
                        container.appendChild(div);
                    });
                }
                previewContent.appendChild(container);
                backBtn.style.display = 'none';
                fileName.textContent = currentFile.name + ' (压缩包)';
            }

            async function previewZipFile(index) {
                if (!zipFiles || index < 0 || index >= zipFiles.length) return;
                const item = zipFiles[index];
                currentZipIndex = index;
                try {
                    const blob = await item.entry.async('blob');
                    const nameParts = item.name.split('.');
                    const ext = nameParts.length > 1 ? nameParts.pop().toLowerCase() : '';
                    const mime = blob.type || '';
                    const type = getFileType(ext, mime);

                    fileName.textContent = item.name;
                    fileSize.textContent = (item.size / 1024).toFixed(1) + ' KB';
                    previewContent.innerHTML = '';
                    backBtn.style.display = 'inline-block';
                    downloadBtn.style.display = 'inline-block';

                    if (type === 'image') {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const img = document.createElement('img');
                            img.src = e.target.result;
                            img.alt = item.name;
                            previewContent.appendChild(img);
                        };
                        reader.readAsDataURL(blob);
                    } else if (type === 'pdf') {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const iframe = document.createElement('iframe');
                            iframe.src = e.target.result;
                            iframe.title = item.name;
                            previewContent.appendChild(iframe);
                        };
                        reader.readAsDataURL(blob);
                    } else {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const text = e.target.result;
                            const pre = document.createElement('pre');
                            pre.textContent = text;
                            previewContent.appendChild(pre);
                        };
                        reader.onerror = () => {
                            previewContent.innerHTML =
                            '<p class="error-text">❌ 无法预览此文件内容</p>';
                        };
                        reader.readAsText(blob);
                    }

                    downloadBtn.onclick = () => {
                        const a = document.createElement('a');
                        const url = URL.createObjectURL(blob);
                        a.href = url;
                        a.download = item.name;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                    };

                } catch (err) {
                    previewContent.innerHTML =
                        `<p class="error-text">❌ 读取文件失败：${err.message}</p>`;
                    console.error(err);
                }
            }

            backBtn.addEventListener('click', () => {
                if (zipFiles) {
                    showZipFileList(zipFiles);
                    backBtn.style.display = 'none';
                    downloadBtn.onclick = () => {
                        if (currentFile) {
                            const a = document.createElement('a');
                            const url = URL.createObjectURL(currentFile);
                            a.href = url;
                            a.download = currentFile.name;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            setTimeout(() => URL.revokeObjectURL(url), 1000);
                        }
                    };
                }
            });

            clearBtn.addEventListener('click', () => {
                previewCard.classList.remove('active');
                previewContent.innerHTML = '';
                fileName.textContent = '文件名';
                fileSize.textContent = '大小';
                currentFile = null;
                zipFiles = null;
                currentZipIndex = -1;
                fileInput.value = '';
                backBtn.style.display = 'none';
                downloadBtn.style.display = 'inline-block';
            });

            uploadArea.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    handleFile(fileInput.files[0]);
                }
            });

            console.log('📂 文件查看器（支持解压ZIP）已加载');
        })();
    </script>
</body>
</html>
